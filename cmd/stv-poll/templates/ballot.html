<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><link rel="stylesheet" href="/static/site.css"><title>{{.Poll.Question}}</title></head><body><main><h1>{{.Poll.Question}}</h1><p>In a small poll, the results or turnout may allow someone to infer how a person voted or whether they took part.</p><form method="post" action="/polls/{{.Poll.ID}}/ballot"><input name="csrf" type="hidden" value="{{.CSRF}}"><input name="version" type="hidden" value="{{.Version}}">{{range .Options}}<label for="rank-{{.ID}}">Rank {{.Label}}</label><input id="rank-{{.ID}}" name="rank" type="number" min="1" max="50" value="{{if .Rank}}{{.Rank}}{{end}}">{{end}}<button type="submit">Save vote</button></form><p><a href="/help/voting">How to vote</a> · <a href="/help/counting">How votes are counted</a></p></main></body></html>
