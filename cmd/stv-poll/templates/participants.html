<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><link rel="stylesheet" href="/static/site.css"><title>Participants for {{.Poll.Question}}</title></head>
<body><main><h1>Participants for {{.Poll.Question}}</h1><p>Put one participant on each line. Separate that participant's email addresses with commas or colons.</p><form method="post"><input name="csrf" type="hidden" value="{{.CSRF}}"><input name="version" type="hidden" value="{{.Poll.Version}}"><label for="participants">Grouped email addresses</label><textarea id="participants" name="participants" rows="12">{{.Rows}}</textarea><label for="copy-poll">Or copy participants from one of your poll IDs</label><input id="copy-poll" name="copy_poll_id"><button type="submit">Save participants</button></form><p><a href="/moderator/polls/{{.Poll.ID}}">Back to poll</a></p></main></body></html>
